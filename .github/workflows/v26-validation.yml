name: V2.6 validation
on:
  push:
    branches: [v26-clean]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V2.6 Smart DCA safety tests
        run: node validation/v26-smart-dca-tests.js
