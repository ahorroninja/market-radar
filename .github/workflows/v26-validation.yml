name: V2.6 validation
on:
  push:
    branches: [v26-clean, v26-backtest-audit]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check production and audit modules
        run: |
          node --check v26-smart-dca.js
          node --check v26-ui.js
          node --check v26-backtest.js
      - name: Run V2.6 Smart DCA safety tests
        run: node validation/v26-smart-dca-tests.js
      - name: Run V2.6 adversarial audit tests
        run: node validation/v26-audit-tests.js
      - name: Run independent performance metric invariants
        run: node validation/v26-metric-tests.js
      - name: Run no-lookahead decision-time invariants
        run: node validation/v26-lookahead-tests.js
      - name: Run contribution and purchase timing invariants
        run: node validation/v26-timing-tests.js
